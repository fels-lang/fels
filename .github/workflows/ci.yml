name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref; a newer push cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast lane: no external LLVM ──────────────────────────────────────────────
  # The LLVM backend compiles to a no-op stub without -Dllvm-path, and the
  # codegen / exe-integration tests skip themselves when LLVM is absent. So this
  # builds the whole compiler and runs the front-end / sema / IR / comptime-VM
  # tests (incl. the 74-case VM corpus) with zero heavyweight setup — it catches
  # the bulk of regressions in ~a minute and gates every PR.
  check:
    name: build + test (no LLVM)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build (LLVM backend = stub)
        run: zig build
      - name: Test (LLVM-independent suite)
        run: zig build test

  # ── Full lane: LLVM codegen + exe integration ────────────────────────────────
  # Builds the real LLVM backend and runs the codegen / exe tests (which compile
  # and run native binaries). LLVM is the official llvm.org release; the setup-llvm
  # action keeps only the files the build and the tests use, and caches them.
  full:
    name: build + test (LLVM)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-size-limit: 4096
      - uses: ./.github/actions/setup-llvm
        id: llvm
      - name: Discover the Windows SDK lib dir
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" |
                 Sort-Object Name -Descending | Select-Object -First 1
          "SDK_LIB=$($sdk.FullName)\um\x64" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build + test (full suite)
        run: >
          zig build test
          -Dllvm-path="${{ steps.llvm.outputs.path }}"
          -Dwindows-sdk-lib-path="${{ env.SDK_LIB }}"

  # ── Linux: the compiler built and tested on Linux ────────────────────────────
  # LLVM linked in statically (llvm.org's Linux release has no shared LLVM), the
  # test programs built as static ELF executables, linked with ld.lld and run.
  # The tests that use the Windows API or the Windows linkers skip themselves.
  linux:
    name: build + test (Linux, LLVM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-size-limit: 4096
      - uses: ./.github/actions/setup-llvm
        id: llvm
      - name: Build + test (full suite)
        run: zig build test -Dllvm-path="${{ steps.llvm.outputs.path }}"
