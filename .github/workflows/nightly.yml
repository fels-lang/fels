name: Nightly

# A rolling pre-release built from the latest `main` on every push, so users can
# always grab the newest build without compiling. The `nightly` tag/release is
# refreshed each run to point at the current commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create/refresh the nightly release + tag

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: build + publish nightly
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-size-limit: 4096
      - uses: ./.github/actions/setup-llvm
        id: llvm
      - name: Build + package
        id: pkg
        shell: pwsh
        run: ./scripts/package.ps1 -LlvmPath "${{ steps.llvm.outputs.path }}"
      - name: Drop the previous nightly (so the tag moves to this commit)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --cleanup-tag --yes
      - name: Publish nightly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly ${{ steps.pkg.outputs.version }}"
          prerelease: true
          files: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.bindgen_archive }}
            ${{ steps.pkg.outputs.linux_cross_archive }}
          body: |
            Automated build from the latest `main`, version `${{ steps.pkg.outputs.version }}`.
            Download `${{ steps.pkg.outputs.archive_name }}`, extract, and run `bin/fels`
            (the standard library + linker travel with it). Refreshed on every push.
