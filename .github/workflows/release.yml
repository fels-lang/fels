name: Release

# Triggered by a version tag. Handles stable releases and pre-releases by the
# SemVer tag itself:
#   v0.1.0          → stable release "gabbro 0.1.0"
#   v0.1.0-beta.1   → pre-release "gabbro 0.1.0-beta.1+<sha>" (full SemVer w/ metadata)
#   v0.2.0-rc.1     → pre-release, etc.
# A tag containing `-` is published as a GitHub pre-release; the `+<git-sha>`
# build metadata is added to the reported version (and release name) for
# traceability, while the asset filename stays URL-friendly.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-size-limit: 4096
      - uses: ./.github/actions/setup-llvm
        id: llvm

      - name: Derive version + channel from the tag
        id: tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''   # v0.1.0-beta.1 -> 0.1.0-beta.1
          "version=$v" | Out-File -Append $env:GITHUB_OUTPUT
          # A SemVer pre-release (contains '-') publishes as a GitHub pre-release.
          $pre = if ($v -match '-') { 'true' } else { 'false' }
          "prerelease=$pre" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Build and package
        id: pkg
        shell: pwsh
        run: ./scripts/package.ps1 -LlvmPath "${{ steps.llvm.outputs.path }}" -Version "${{ steps.tag.outputs.version }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "gabbro ${{ steps.pkg.outputs.version }}"
          prerelease: ${{ steps.tag.outputs.prerelease }}
          files: ${{ steps.pkg.outputs.archive }}
          generate_release_notes: true
          body: |
            **gabbro ${{ steps.pkg.outputs.version }}** — x86_64-windows.

            Download `${{ steps.pkg.outputs.archive_name }}`, extract, and run
            `bin/gabbro` — the standard library and linker travel with it (no install
            step, no separate LLVM needed to *use* the compiler).
