name: Release

# A version tag builds the release archives and publishes a GitHub release:
#   v0.3.1         stable release "gabbro 0.3.1"
#   v0.4.0-rc.1    pre-release (any tag with a "-")
# The release notes are the matching section of CHANGELOG.md ("## 0.3.1 ..."). A pre-release
# without its own section uses "## Unreleased".
#
# Run it by hand (Actions > Release > Run workflow) to build, package and smoke test without
# publishing. The archives are kept as workflow artifacts either way.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  release:
    name: build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-size-limit: 4096
      - uses: ./.github/actions/setup-llvm
        id: llvm

      - name: Version and notes from the tag
        id: tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''   # v0.4.0-rc.1 -> 0.4.0-rc.1
          $base = $v -replace '-.*$', ''
          $pre = $v -ne $base
          # The tag and build.zig.zon must name the same version.
          $zon = (Select-String -Path build.zig.zon -Pattern '\.version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if (($zon -replace '-.*$', '') -ne $base) { throw "tag $v does not match build.zig.zon version $zon" }

          # The CHANGELOG.md section: from its "## " heading to the next one.
          $lines = Get-Content CHANGELOG.md
          $heads = @("^## $([regex]::Escape($v))(\s|$)")
          if ($pre) { $heads += "^## Unreleased(\s|$)" }
          $notes = $null
          foreach ($h in $heads) {
              $i = 0
              while ($i -lt $lines.Count -and $lines[$i] -notmatch $h) { $i++ }
              if ($i -ge $lines.Count) { continue }
              $end = $i + 1
              while ($end -lt $lines.Count -and $lines[$end] -notmatch '^## ') { $end++ }
              if ($end -gt $i + 1) { $notes = ($lines[($i + 1)..($end - 1)] -join "`n").Trim() }
              break
          }
          if (-not $notes) { throw "CHANGELOG.md has no section for $v" }
          $notes | Out-File -Encoding utf8 notes.md

          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "prerelease=$($pre.ToString().ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build and package
        id: pkg
        shell: pwsh
        run: ./scripts/package.ps1 -LlvmPath "${{ steps.llvm.outputs.path }}" -Version "${{ steps.tag.outputs.version }}"

      # Run the packaged compiler from a folder outside the repo, the way a user gets it.
      - name: Smoke test the archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          Expand-Archive "${{ steps.pkg.outputs.archive }}" $dir
          $gabbro = Get-ChildItem -Recurse $dir -Filter gabbro.exe | Select-Object -First 1
          & cmd /c "`"$($gabbro.FullName)`" version 2>&1"
          @'
          #import std.io.{ println };

          main :: fn() -> i32 {
              println("hello from Gabbro");
              return 5;
          }
          '@ | Out-File -Encoding utf8 (Join-Path $dir "hello.gab")
          Push-Location $dir
          & $gabbro.FullName build hello.gab
          if ($LASTEXITCODE -ne 0) { throw "gabbro build failed ($LASTEXITCODE)" }
          & .\hello.exe
          if ($LASTEXITCODE -ne 5) { throw "hello.exe returned $LASTEXITCODE, expected 5" }

          # The same program through build.gab (0.1.0 shipped with this path broken).
          Remove-Item hello.exe
          @'
          #import std.build.{ Build, executable, default };

          build :: fn(b: Build) {
              exe := b.executable("hello", "hello.gab");
              b.default(exe);
          }
          '@ | Out-File -Encoding utf8 build.gab
          & $gabbro.FullName build
          if ($LASTEXITCODE -ne 0) { throw "gabbro build (build.gab) failed ($LASTEXITCODE)" }
          & .\hello.exe
          if ($LASTEXITCODE -ne 5) { throw "hello.exe from build.gab returned $LASTEXITCODE, expected 5" }
          Pop-Location
          exit 0 # the step would otherwise fail with hello.exe's exit code

      - name: Keep the archives
        uses: actions/upload-artifact@v4
        with:
          name: gabbro-${{ steps.pkg.outputs.file_version }}
          path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.bindgen_archive }}
            ${{ steps.pkg.outputs.linux_cross_archive }}
          compression-level: 0 # already zipped

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: gabbro ${{ steps.tag.outputs.version }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          body_path: notes.md
          files: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.bindgen_archive }}
            ${{ steps.pkg.outputs.linux_cross_archive }}
